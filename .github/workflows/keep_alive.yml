name: Keep Website Alive

on:
  workflow_dispatch: # <-- Эта строчка добавит кнопку ручного запуска!
  schedule:
    # Запуск каждые 12 минут
    - cron: '*/12 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Ping Render Server
      run: curl -s https://site-zq0u.onrender.com > /dev/null
